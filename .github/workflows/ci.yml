# 검사 전용. **배포하지 않는다** — 배포는 Vercel이 main push마다 알아서 한다.
#
# `npm run build`를 여기서 돌리지 않는 이유:
#   Vercel이 push마다 빌드하고 실패하면 배포를 막아준다. Actions에서 또 빌드하면
#   같은 일을 두 번 하면서 실행 시간만 늘어난다.
#   CI의 고유 가치는 **유닛 테스트와 DB 통합 테스트** — 그건 다른 어디에서도 안 돈다.
#
# 잡을 하나로 합쳐 둔 것도 같은 이유다. 잡을 나누면 `npm ci`가 잡마다 돌아 시간이 두 배로 든다.
#
# 2026-10-08 정정: 예전 주석은 "private 저장소의 월 2,000분만 먹는다"고 적고 있었다.
# 이 저장소는 **public** 이고, public 저장소의 표준 러너는 분이 무료·무제한이다.
# 분을 아끼는 것이 이유가 아니라 중복 작업과 피드백 지연을 피하는 것이 이유다.
# (public 이라 생기는 **진짜** 문제는 60일 무활동 cron 비활성화다 — AGENTS.md 참고)
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "photos/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "photos/**"
      - "**.md"

# 같은 브랜치에 연달아 push하면 앞선 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # 로컬 docker-compose.dev.yml 과 같은 이미지를 써서 통합 테스트를 돌린다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wedinvi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # 러너 안의 서비스 컨테이너. 로컬(55432)과 포트만 다르다.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/wedinvi
      DIRECT_URL: postgres://postgres:postgres@localhost:5432/wedinvi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 유닛 테스트
        run: |
          npm run test:story
          npm run test:dance

      # db-migrate.ts는 .env 파일이 없으면 환경변수를 쓴다.
      - name: 마이그레이션 적용 (러너 안 DB)
        run: npm run db:migrate

      - name: DB 통합 테스트
        run: npm run test:db
