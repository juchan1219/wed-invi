# 로컬 개발/검증 전용. 배포에는 쓰이지 않는다.
#
# 배포는 Supabase(Postgres)를 쓰고, 앱은 평범한 Postgres 프로토콜로 붙는다.
# 그래서 로컬은 Postgres 컨테이너 하나면 충분하다 — 중계 프록시가 필요 없다.
# (Neon HTTP 드라이버를 쓰던 시절에는 HTTP↔Postgres 프록시가 하나 더 있었다. 2026-09-27 제거)
#
# 사용:
#   docker compose -f docker-compose.dev.yml up -d
#   .env.local 에  DATABASE_URL="postgres://postgres:postgres@localhost:55432/wedinvi"
#                  DIRECT_URL="postgres://postgres:postgres@localhost:55432/wedinvi"
#   npm run db:migrate
#
# Supabase 프로젝트를 하나 더 만들어 개발용으로 써도 된다. 그 경우 이 파일은 필요 없다.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wedinvi
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
